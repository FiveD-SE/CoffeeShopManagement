name: Run Tests

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Go to the CoffeeShopManagement directory
              run: cd CoffeeShopManagement
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm run test
